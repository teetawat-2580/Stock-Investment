name: Daily Stock Data Update

on:
  schedule:
    # Run Tuesday-Saturday at 22:00 UTC (05:00 AM UTC+7 / after US market close)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance python-dateutil

      - name: Run Master Update Script
        run: |
          python scripts/update_all.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stock_prices.js data/analysis.js data/events.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: daily stock data update"
            git push
          fi
